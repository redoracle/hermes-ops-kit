[project]
name = "hermes-ops-kit"
version = "0.10.1"
description = "Operational and security plugin for Hermes Agent: provider routing, secret and key lifecycle, preflight plugin scanning, MCP auditing, cost governance, diagnostics, and remote assistant delegation."
requires-python = ">=3.11"
dependencies = [
  # Core
  "requests>=2.31",       # Google validation, admin API calls, GitHub curl fallback
  "PyYAML>=6.0",          # Config parsing (assistants.yaml, routes.yaml, env_projection)
  "python-dotenv>=1.0",   # env/loader.py — sole .env/.env.generated parser
  "ruamel.yaml>=0.18,<0.20",  # YAML round-trip; compatible with current Conda releases
  # Provider SDKs — all 5 providers, full validation + smoke test coverage
  "openai>=2.0",          # OpenAI + DeepSeek validation (DeepSeek is OpenAI-compatible)
  "anthropic>=0.40",      # Anthropic validation + smoke test
  "google-auth>=2.0",     # Google auto-creation via API Keys API (ADC)
  "google-genai>=1.0",    # Gemini image generation (Nano Banana, image-to-image)
  "PyJWT>=2.8",           # GitHub App RS256 JWT token minting
  # Image generation
  "Pillow>=10.0",         # Image metadata and format handling
  "fal-client>=0.6",      # FAL.ai Flux/Stable Diffusion (cloud fallback)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
# Headroom compression proxy for `hermes-ops-kit headroom` (install.sh
# prefers pipx for the CLI binary; this extra covers venv installs).
headroom = [
  "headroom-ai[proxy]>=0.24",
]

[project.scripts]
hermes-ops-kit = "hermes_ops_kit.bridge:main"
hermes-usage = "hermes_ops_kit.usage_metrics_v2:main"
hermes-key-rotate = "hermes_ops_kit.hermes_key_rotate:main"
hermes-assistant-manager = "hermes_ops_kit.hermes_assistant_manager:main"
hermes-route-manager = "hermes_ops_kit.hermes_route_manager:main"
hermes-export = "hermes_ops_kit.hermes_export:main"
hermes-skill-factory = "hermes_ops_kit.hermes_skill_factory:main"

[project.entry-points."hermes_agent.plugins"]
# Module-only target: ep.load() returns the hermes_ops_kit package, which
# exposes a top-level register(ctx) (the directory-plugin root __init__.py
# re-exports the same callable — both load modes stay in parity).
hermes-ops-kit = "hermes_ops_kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_ops_kit"]

[tool.ruff]
# Pin the lint ruleset explicitly so CI is stable across ruff version bumps.
# Ruff 0.16 expanded its default selection (added B/DTZ/RUF/etc.), which broke
# CI with 697 errors on previously-clean code. This restores the pre-0.16
# stable default (E4/E7/E9/F) the project was passing with on 2026-07-14.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: real-venv installation tests (slower; run explicitly with -m integration)",
]
