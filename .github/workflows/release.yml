name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Publishing waits for a maintainer's approval once this environment has required
    # reviewers (repository Settings > Environments > release). Without that setting the
    # job runs unattended, as before.
    environment: release
    outputs:
      pypi_ready: ${{ steps.pypi_release.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Build distributions
        if: env.RELEASE_PREPARED == 'true'
        env:
          RELEASE_PREPARED: ${{ hashFiles('.release-prepared') != '' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check build
          python3 -m build
          ls -la dist/

      # The Git tag points at the pre-sync commit (version files still at the
      # old version until the Contents-API sync lands on main). Attach the
      # built artifacts to the release so remote hosts get correct metadata:
      # pip install <release asset URL> instead of git+<tag>.
      - name: Attach artifacts to release
        if: env.RELEASE_PREPARED == 'true'
        env:
          RELEASE_PREPARED: ${{ hashFiles('.release-prepared') != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(cat .release-prepared)
          gh release upload "v${VERSION}" dist/* --clobber

      # Build and release happen without access to OIDC publishing credentials.
      - name: Upload Python distributions for PyPI
        if: env.RELEASE_PREPARED == 'true'
        env:
          RELEASE_PREPARED: ${{ hashFiles('.release-prepared') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Sync version files to repo (4-way invariant)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f .release-prepared ]; then
            echo "No release prepared — skipping sync"
            exit 0
          fi
          VERSION=$(cat .release-prepared)
          echo "Syncing version files for ${VERSION}"
          # 5-way invariant (tests/test_versions.py): compat.yaml ops_kit_version
          # must be bumped with the other four or the version test fails post-release.
          sed -i.bak "s/^ops_kit_version: \".*\"/ops_kit_version: \"${VERSION}\"/" hermes_ops_kit/config/compat.yaml && rm -f hermes_ops_kit/config/compat.yaml.bak
          for FILE in pyproject.toml plugin.yaml hermes_ops_kit/__init__.py hermes_ops_kit/security/plugin_scanner/__init__.py hermes_ops_kit/config/compat.yaml; do
            [ -f "$FILE" ] || { echo "WARN: $FILE missing — skipping"; continue; }
            SHA=$(gh api "repos/${{ github.repository }}/contents/$FILE" --jq '.sha')
            ENCODED=$(base64 -w 0 "$FILE")
            gh api "repos/${{ github.repository }}/contents/$FILE" \
              -X PUT \
              -f message="chore: update $FILE version to ${VERSION}" \
              -f content="$ENCODED" \
              -f sha="$SHA" \
              --jq '.commit.sha' >/dev/null
            echo "  $FILE synced"
          done
          echo "version files synced for ${VERSION}"

      # A rerun without a new semantic-release version must not republish to PyPI.
      - name: Mark Python distributions ready
        id: pypi_release
        if: success()
        shell: bash
        run: |
          if [[ -s .release-prepared ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  pypi-publish:
    name: Publish to PyPI (OIDC)
    needs: release
    if: needs.release.outputs.pypi_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/hermes-ops-kit/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download prepared Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish distributions to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
