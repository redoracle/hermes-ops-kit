name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Sync version files to repo (4-way invariant)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f .release-prepared ]; then
            echo "No release prepared — skipping sync"
            exit 0
          fi
          VERSION=$(cat .release-prepared)
          echo "Syncing version files for ${VERSION}"
          for FILE in pyproject.toml plugin.yaml hermes_ops_kit/__init__.py hermes_ops_kit/security/plugin_scanner/__init__.py; do
            [ -f "$FILE" ] || { echo "WARN: $FILE missing — skipping"; continue; }
            SHA=$(gh api "repos/${{ github.repository }}/contents/$FILE" --jq '.sha')
            ENCODED=$(base64 -w 0 "$FILE")
            gh api "repos/${{ github.repository }}/contents/$FILE" \
              -X PUT \
              -f message="chore: update $FILE version to ${VERSION}" \
              -f content="$ENCODED" \
              -f sha="$SHA" \
              --jq '.commit.sha' >/dev/null
            echo "  $FILE synced"
          done
          echo "version files synced for ${VERSION}"
