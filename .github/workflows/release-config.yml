name: Release config

# Runs the real semantic-release plugins on sample commits, so a dependency bump that would
# break the next release fails here instead. Only when release tooling changes.
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .releaserc.json
      - scripts/check-release-notes.mjs
      - .github/workflows/release-config.yml

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check the release tooling
        run: node scripts/check-release-notes.mjs
