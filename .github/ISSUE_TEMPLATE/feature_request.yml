name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Please review the project boundaries first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? What's the operational pain point?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see. Be specific about CLI commands, config format, and behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: checkboxes
    id: boundaries
    attributes:
      label: Stays in ops-kit's lane?
      options:
        - label: This does NOT replace Hermes core functionality (routing, model invocation, memory, skills, scheduler, gateway)
        - label: This is an operational/security concern (secrets, keys, metrics, routing config, audit, MCP)
