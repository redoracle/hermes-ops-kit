name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of hermes-ops-kit are you using?
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug — what did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands to run, in order.
      placeholder: |
        1. Run `hermes-ops-kit doctor`
        2. See error: "..."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste relevant command output (secrets will be redacted — run with --plain).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I've run `hermes-ops-kit doctor` and included the output
        - label: I'm on the latest version
        - label: I've checked for existing issues reporting this bug
